name: web_minify
description: >-
  HTML, CSS and JavaScript minifiers in pure Dart. One call minifies a whole
  page, inline style and script blocks included, with no external dependencies.
version: 1.0.1
homepage: https://www.comapps.be
repository: https://github.com/raphrmx/web_minify
issue_tracker: https://github.com/raphrmx/web_minify/issues

topics:
  - minify
  - html
  - css
  - javascript
  - optimization

environment:
  sdk: ^3.0.0

dev_dependencies:
  lint: ^2.8.0
  test: ^1.31.1
